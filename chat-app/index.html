<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Chat</title>
  <meta name="description" content="Local AI chat powered by Ollama — runs entirely on your machine." />

  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Marked.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Conversations</div>
        <button class="btn-new-chat" id="new-chat-btn" title="New Chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Chat
        </button>
      </div>
      <div class="sessions-list" id="sessions-list">
        <div class="sessions-empty">No chats yet</div>
      </div>
    </aside>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ===== Main ===== -->
    <main class="main">

      <!-- Top Bar -->
      <header class="topbar">
        <button class="btn-sidebar-toggle" id="sidebar-toggle" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <span class="topbar-title" id="topbar-title">Ollama Chat</span>

        <select class="model-selector" id="model-select" title="Select Model">
          <option value="llama3.2">llama3.2</option>
          <option value="llama3.1">llama3.1</option>
          <option value="llama3">llama3</option>
          <option value="mistral">mistral</option>
          <option value="mistral-nemo">mistral-nemo</option>
          <option value="gemma2">gemma2</option>
          <option value="gemma2:2b">gemma2:2b</option>
          <option value="phi3">phi3</option>
          <option value="phi3:mini">phi3:mini</option>
          <option value="codellama">codellama</option>
          <option value="codellama:13b">codellama:13b</option>
          <option value="deepseek-r1">deepseek-r1</option>
          <option value="deepseek-coder">deepseek-coder</option>
          <option value="qwen2.5">qwen2.5</option>
          <option value="qwen2.5-coder">qwen2.5-coder</option>
          <option value="neural-chat">neural-chat</option>
          <option value="starling-lm">starling-lm</option>
          <option value="solar">solar</option>
          <option value="dolphin-mistral">dolphin-mistral</option>
          <option value="nous-hermes2">nous-hermes2</option>
        </select>

        <div class="topbar-actions">
          <button class="btn-icon" id="export-btn" title="Export conversation as .txt">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat Area -->
      <div class="chat-area" id="chat-area">
        <!-- Content rendered by JS -->
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            placeholder="Type a message… (Shift+Enter for new line)"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>

          <button class="btn-send" id="send-btn" title="Send (Enter)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>

          <button class="btn-stop" id="stop-btn" title="Stop generating" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">
          Powered by <strong>Ollama</strong> — runs locally on your machine &nbsp;·&nbsp; Shift+Enter for new line
        </div>
      </div>

    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
